<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>来电疑云</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@500;700&family=JetBrains+Mono:wght@400;600&family=ZCOOL+XiaoWei&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/style.css" />
</head>
<body>
  <div class="noise"></div>
  <div class="glow"></div>

  <header class="top">
    <div class="brand">来电疑云</div>
    <div class="meta" id="meta"></div>
  </header>

  <main>
    <section id="landing" class="panel landing">
      <p class="eyebrow">灵矽 Builder Day · 语音辨谎</p>
      <h1>午夜响起的<br />那通电话</h1>
      <p class="lead">多人语音社交推理。听清线索，识破骗子，投出真凶。</p>
      <div class="story-block">
        <p class="label">选择故事</p>
        <div id="storyList" class="story-list"></div>
      </div>
      <div class="form-row">
        <input id="nameInput" maxlength="12" placeholder="大厅昵称（角色剧本开局后显示角色名）" value="接线员" />
      </div>
      <div class="cta-row">
        <button id="btnCreate" class="btn primary">创建房间</button>
        <button id="btnJoin" class="btn ghost">加入房间</button>
        <button id="btnSolo" class="btn accent">单人演示（补机器人）</button>
      </div>
      <div class="form-row join-code hidden" id="joinRow">
        <input id="codeInput" maxlength="8" placeholder="房间号" />
        <button id="btnJoinConfirm" class="btn primary">进入</button>
      </div>
    </section>

    <section id="table" class="hidden">
      <div class="layout">
        <aside class="side">
          <div class="card-block">
            <h2>房间 <span id="roomCode" class="mono"></span></h2>
            <ul id="playerList" class="players"></ul>
          </div>
          <div class="card-block secret" id="secretBlock">
            <h2>秘密身份卡</h2>
            <p id="secretRole" class="role"></p>
            <p id="secretCard" class="secret-text"></p>
          </div>
          <div class="card-block controls" id="lobbyControls">
            <button id="btnFillBots" class="btn ghost">补机器人到 3 人</button>
            <button id="btnStart" class="btn primary">开始游戏</button>
          </div>
        </aside>

        <section class="stage">
          <div class="phase-pill" id="phasePill">大厅</div>
          <div class="phone">
            <div class="phone-screen">
              <div class="caller" id="callerHint">未知来电 · …</div>
              <div class="host-line" id="hostLine">…</div>
            </div>
            <div class="phone-actions">
              <button id="btnSpeakHost" class="btn tiny" type="button">朗读主持词</button>
              <button id="btnSkipHost" class="btn tiny ghost" type="button">跳过</button>
            </div>
          </div>

          <section id="settlementHero" class="settlement-hero hidden" aria-label="对局结算">
            <div class="settlement-head">
              <div>
                <span class="settlement-badge">对局结束</span>
                <h2 class="settlement-title">本局复盘</h2>
                <p class="settlement-sub" id="settlementSubtitle">查看评分与反诈要点</p>
              </div>
              <div class="settlement-head-actions">
                <button id="btnSpeakValue" class="btn ghost" type="button">朗读复盘</button>
                <button id="btnReplay" class="btn primary" type="button">再来一局</button>
              </div>
            </div>
            <div class="settlement-grid">
              <div id="scoreBoard" class="settlement-card score-board">
                <h3>本局评分</h3>
                <ul id="scoreList" class="score-list"></ul>
              </div>
              <div id="valueRecap" class="settlement-card value-recap">
                <h3>复盘</h3>
                <p class="value-theme" id="valueTheme"></p>
                <ul class="value-points" id="valuePoints"></ul>
                <p class="value-closing" id="valueClosing"></p>
              </div>
            </div>
          </section>

          <details id="logPanel" class="log card-block log-panel" open>
            <summary class="log-summary">
              <span id="logPanelTitle">现场记录</span>
              <span class="log-summary-hint" id="logPanelHint">（点击展开）</span>
            </summary>
            <div id="log" class="log-body"></div>
          </details>

          <div class="action" id="actionPanel">
            <div id="briefingActions" class="hidden">
              <button id="btnAdvance" class="btn primary" type="button">听完了，进入盘问</button>
            </div>
            <div id="speakActions" class="hidden">
              <label class="label">你的发言</label>
              <textarea id="speakText" rows="3" placeholder="可直接打字，或按住说话听写…"></textarea>
              <p class="speak-status" id="speakStatus">轮到你了：按住说话录音，松手后本地识别；也可直接打字。</p>
              <div class="cta-row">
                <button id="btnMic" class="btn ghost hold-talk" type="button">按住说话</button>
                <button id="btnMicToggle" class="btn ghost" type="button">点按录音</button>
                <button id="btnSubmitSpeak" class="btn primary" type="button">提交发言</button>
              </div>
            </div>
            <div id="evidenceActions" class="hidden">
              <p class="label">物证板已更新，可发动技能后继续</p>
              <div id="abilityBar" class="cta-row"></div>
              <button id="btnAdvanceEvidence" class="btn primary" type="button">进入怀疑标记</button>
            </div>
            <div id="markActions" class="hidden">
              <label class="label">怀疑标记：点名你最怀疑的人</label>
              <div id="markTargets" class="vote-grid"></div>
              <div id="abilityBarMark" class="cta-row" style="margin-top:0.6rem"></div>
            </div>
            <div id="voteActions" class="hidden">
              <label class="label" id="voteLabel">指认来电骗子</label>
              <div id="voteTargets" class="vote-grid"></div>
            </div>
            <div id="endActions" class="hidden"></div>
          </div>

          <div id="clueBoard" class="card-block clue-board hidden">
            <h2>物证板</h2>
            <ul id="clueList" class="clue-list"></ul>
          </div>

        </section>
      </div>
    </section>
  </main>

  <footer class="foot">
    <span>对接灵矽 MCP：</span>
    <code id="mcpUrl"></code>
  </footer>

  <script src="/app.js"></script>
</body>
</html>
